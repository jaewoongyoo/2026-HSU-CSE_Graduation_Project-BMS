name: Deploy AI Server to AWS EC2

on:
  push:
    branches:
      - develop
    paths:
      - 'ai/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.AI_DOCKER_USERNAME }}
          password: ${{ secrets.AI_DOCKER_PASSWORD }}

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: ${{ secrets.AI_DOCKER_USERNAME }}/bms-ai:latest

      - name: EC2 SSH 접속 후 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AI_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_AI_SSH_KEY }}
          script: |
            docker pull ${{ secrets.AI_DOCKER_USERNAME }}/bms-ai:latest
            docker stop bms-ai || true
            docker rm bms-ai || true
            docker run -d \
              --name bms-ai \
              --restart always \
              -p 8000:8000 \
              ${{ secrets.AI_DOCKER_USERNAME }}/bms-ai:latest
            docker image prune -f
